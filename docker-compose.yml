services:
  solarguard:
    build: .
    restart: unless-stopped
    environment:
      # Criptografa os tokens salvos pelas contas. Se ela mudar, cada conta precisa
      # informar o token de novo.
      SOLARGUARD_SECRET_KEY: ${SOLARGUARD_SECRET_KEY:?defina SOLARGUARD_SECRET_KEY}
      SOLARGUARD_MCP_TOKEN: ${SOLARGUARD_MCP_TOKEN:-}
      # A porta só é alcançável pelo proxy reverso. Não publique com "ports".
      SOLARGUARD_TRUST_PROXY: "true"
    expose:
      - "8080"
    volumes:
      - solarguard-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/login"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

# O banco é um arquivo SQLite dentro deste volume: não há container de banco.
volumes:
  solarguard-data:

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - SolarGuard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <div class="login-card card">
    <h2 class="login-title">SolarGuard</h2>
    <p class="muted text-center">Monitoramento solar</p>

    {{if .Error}}
    <div class="message message-error">{{.Error}}</div>
    {{end}}

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" class="form-control" value="{{.Email}}" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-submit btn">Entrar</button>
    </form>
    <p class="login-alt">Ainda não tem conta? <a href="/signup">Criar conta</a></p>
  </div>
</body>
</html>

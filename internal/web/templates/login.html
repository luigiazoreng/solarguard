<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - SolarGuard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <div class="login-card card">
    <h2 class="login-title">SolarGuard</h2>
    <p class="muted text-center">Monitoramento solar</p>

    {{if .Error}}
    <div class="message message-error">
      {{.Error}}
    </div>
    {{end}}

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="password">Senha de administrador</label>
        <input type="password" id="password" name="password" class="form-control" required autofocus autocomplete="current-password">
      </div>
      <button type="submit" class="login-submit btn">Entrar</button>
    </form>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{.CSRFToken}}">
  <title>{{.Title}} - SolarGuard</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/uPlot.min.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/uPlot.iife.min.js"></script>
  <script src="/static/app.js"></script>
</head>
<body hx-headers='{"HX-CSRF-Token": "{{.CSRFToken}}"}'>
  {{if .ShowLoopbackBanner}}
  <div class="banner-loopback">sem senha: acesso apenas local</div>
  {{end}}

  <header class="navbar">
    <a href="/" class="nav-brand">☀️ SolarGuard</a>
    <nav>
      <ul class="nav-links">
        <li><a href="/" {{if eq .ActiveNav "overview"}}class="active"{{end}}>Visão geral</a></li>
        <li><a href="/alerts" {{if eq .ActiveNav "alerts"}}class="active"{{end}}>Alertas</a></li>
        <li><a href="/reports" {{if eq .ActiveNav "reports"}}class="active"{{end}}>Relatórios</a></li>
        <li><a href="/manage" {{if eq .ActiveNav "manage"}}class="active"{{end}}>Gestão</a></li>
        {{if not .NoAuth}}
        <li>
          <form action="/logout" method="POST" style="display:inline;">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <button type="submit" class="btn btn-secondary btn-sm">Sair</button>
          </form>
        </li>
        {{end}}
      </ul>
    </nav>
  </header>

  <main class="container">
    {{template "content" .}}
  </main>
</body>
</html>
